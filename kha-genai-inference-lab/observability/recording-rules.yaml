# KHA recording rules + SLO alerts. Metric names cover both older and newer vLLM spellings.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: kha-genai-rules
  namespace: monitoring
  labels:
    release: kps
spec:
  groups:
    - name: kha-llm-tenant.rules
      interval: 30s
      rules:
        - record: kha:llm_generation_tokens:rate1m
          expr: sum by (namespace, service) (rate(vllm:generation_tokens_total[1m]))
        - record: kha:llm_prompt_tokens:rate1m
          expr: sum by (namespace, service) (rate(vllm:prompt_tokens_total[1m]))
        - record: kha:llm_requests_success:rate1m
          expr: sum by (namespace, service) (rate(vllm:request_success_total[1m]))
        - record: kha:llm_ttft_seconds:p95_5m
          expr: histogram_quantile(0.95, sum by (le, namespace, service) (rate(vllm:time_to_first_token_seconds_bucket[5m])))
        - record: kha:llm_itl_seconds:p95_5m
          expr: |
            histogram_quantile(0.95, sum by (le, namespace, service) (rate(vllm:inter_token_latency_seconds_bucket[5m])))
            or
            histogram_quantile(0.95, sum by (le, namespace, service) (rate(vllm:time_per_output_token_seconds_bucket[5m])))
        - record: kha:llm_requests_waiting
          expr: sum by (namespace, service) (vllm:num_requests_waiting)
        - record: kha:llm_requests_running
          expr: sum by (namespace, service) (vllm:num_requests_running)
        - record: kha:llm_kv_cache_usage
          expr: max by (namespace, service) (vllm:kv_cache_usage_perc) or max by (namespace, service) (vllm:gpu_cache_usage_perc)
        - record: kha:llm_prefix_cache_hit_ratio:5m
          expr: |
            sum by (namespace, service) (rate(vllm:prefix_cache_hits_total[5m]))
            / clamp_min(sum by (namespace, service) (rate(vllm:prefix_cache_queries_total[5m])), 1)
    - name: kha-gpu-energy.rules
      interval: 30s
      rules:
        # Device-level fields repeat on every MIG instance series -> max by UUID, never sum.
        - record: kha:gpu_power_watts
          expr: max by (Hostname, UUID) (DCGM_FI_DEV_POWER_USAGE)
        - record: kha:gpu_avg_watts_from_energy:5m
          expr: max by (Hostname, UUID) (rate(DCGM_FI_DEV_TOTAL_ENERGY_CONSUMPTION[5m])) / 1000
        - record: kha:cluster_generated_tokens_per_joule:5m
          expr: sum(rate(vllm:generation_tokens_total[5m])) / clamp_min(sum(kha:gpu_avg_watts_from_energy:5m), 1)
        - record: kha:mig_instance_gr_engine_active
          expr: avg by (Hostname, UUID, GPU_I_PROFILE, GPU_I_ID, namespace, pod) (DCGM_FI_PROF_GR_ENGINE_ACTIVE)
        - record: kha:gpu_dram_active
          expr: avg by (Hostname, UUID, GPU_I_PROFILE, GPU_I_ID, namespace, pod) (DCGM_FI_PROF_DRAM_ACTIVE)
    - name: kha-slo.alerts
      rules:
        - alert: KHAPriorAuthTTFTSLOBreach
          expr: kha:llm_ttft_seconds:p95_5m{namespace="kha-um"} > 1.5
          for: 10m
          labels: {severity: page, tenant: utilization-management}
          annotations:
            summary: "Prior-auth TTFT p95 above 1.5 s for 10 minutes"
            runbook: "drills/README.md"
        - alert: KHASharedQueueBacklog
          expr: kha:llm_requests_waiting{namespace="kha-shared"} > 16
          for: 5m
          labels: {severity: ticket, tenant: shared-services}
          annotations:
            summary: "shared-llm has more than 16 queued requests for 5 minutes (HPA or capacity issue)"
        - alert: KHAGpuXidError
          expr: max by (Hostname, UUID) (DCGM_FI_DEV_XID_ERRORS) > 0
          for: 1m
          labels: {severity: page}
          annotations:
            summary: "GPU reported an XID error; check driver logs and nvidia-smi on the node"
