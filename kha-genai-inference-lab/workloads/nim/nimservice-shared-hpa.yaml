# M9: same shared-llm, now autoscaled on vLLM queue depth (custom metric from prometheus-adapter).
# spec.replicas must be omitted when scale.enabled is true.
apiVersion: apps.nvidia.com/v1alpha1
kind: NIMService
metadata:
  name: shared-llm
  namespace: kha-shared
  labels:
    kha.io/tenant: shared-services
spec:
  userID: 1000
  groupID: 0
  image:
    repository: ${NIM_LLM_IMAGE}
    tag: "${NIM_LLM_TAG}"
    pullPolicy: IfNotPresent
    pullSecrets:
      - ngc-secret
  authSecret: ngc-api-secret
  storage:
    nimCache:
      name: llama-3-1-8b
      profile: vllm-${LLM_PRECISION}-tp1-pp1
  env:
    - name: NIM_PASSTHROUGH_ARGS
      value: "--max-model-len ${SHARED_MAX_MODEL_LEN} ${SHARED_EXTRA_ARGS}"
  resources:
    limits:
      ${MIG_MEDIUM}: 1
  nodeSelector:
    kha.io/pool: mig
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
    - key: kubernetes.azure.com/scalesetpriority
      operator: Equal
      value: spot
      effect: NoSchedule
  expose:
    service:
      type: ClusterIP
      port: 8000
  metrics:
    enabled: true
    serviceMonitor:
      interval: 15s
  scale:
    enabled: true
    hpa:
      minReplicas: 1
      maxReplicas: 2
      metrics:
        - type: Pods
          pods:
            metric:
              name: vllm_num_requests_waiting
            target:
              type: AverageValue
              averageValue: "4"
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - type: Pods
              value: 1
              periodSeconds: 60
        scaleDown:
          stabilizationWindowSeconds: 300
  startupProbe:
    enabled: true
    probe:
      httpGet:
        path: /v1/health/ready
        port: 8000
      initialDelaySeconds: 30
      periodSeconds: 10
      failureThreshold: 180
