# M5 job 1 (CPU): synthetic, labeled request notes generated by the prior-auth NIM.
apiVersion: batch/v1
kind: Job
metadata:
  name: triage-data
  namespace: kha-shared
spec:
  backoffLimit: 1
  template:
    metadata:
      labels: {app: triage-data}
    spec:
      restartPolicy: Never
      containers:
        - name: generate
          image: python:3.12-slim
          command: ["python3", "/code/gen_synthetic_data.py"]
          env:
            - {name: LLM_URL, value: "http://priorauth-llm.kha-um.svc:8000/v1/chat/completions"}
            - {name: LLM_MODEL, value: "${NIM_LLM_MODEL}"}
            - {name: NUM_SAMPLES, value: "1200"}
            - {name: OUT_PATH, value: "/models/triage/data/synthetic.jsonl"}
          resources:
            requests: {cpu: 500m, memory: 512Mi}
          volumeMounts:
            - {name: models, mountPath: /models}
            - {name: code, mountPath: /code}
      volumes:
        - name: models
          persistentVolumeClaim: {claimName: triage-models}
        - name: code
          configMap: {name: triage-code}
---
# M5 job 2 (GPU, 1g slice): PyTorch fine-tune + ONNX export (init container), then TensorRT engine build.
apiVersion: batch/v1
kind: Job
metadata:
  name: triage-train-build
  namespace: kha-shared
spec:
  backoffLimit: 0
  template:
    metadata:
      labels: {app: triage-train-build}
    spec:
      restartPolicy: Never
      nodeSelector: {kha.io/pool: mig}
      tolerations:
        - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
        - {key: kubernetes.azure.com/scalesetpriority, operator: Equal, value: spot, effect: NoSchedule}
      initContainers:
        - name: train
          image: nvcr.io/nvidia/pytorch:${NGC_RELEASE}-py3
          command: ["bash", "-c"]
          args:
            - |
              set -euo pipefail
              echo "waiting for synthetic data..."
              until [ -f /models/triage/data/.done ]; do sleep 15; done
              pip install -q "transformers>=4.45" onnx onnxscript
              python /code/train_export.py
          env:
            - {name: BASE_MODEL, value: "${TRIAGE_BASE_MODEL}"}
            - {name: WORK_DIR, value: /models/triage}
            - {name: HF_HOME, value: /models/hf-cache}
          resources:
            limits: {${MIG_SMALL}: 1}
          volumeMounts:
            - {name: models, mountPath: /models}
            - {name: code, mountPath: /code}
            - {name: dshm, mountPath: /dev/shm}
      containers:
        - name: build
          image: nvcr.io/nvidia/tensorrt:${NGC_RELEASE}-py3
          command: ["bash", "/code/build_engine.sh"]
          env:
            - {name: WORK_DIR, value: /models/triage}
          resources:
            limits: {${MIG_SMALL}: 1}
          volumeMounts:
            - {name: models, mountPath: /models}
            - {name: code, mountPath: /code}
      volumes:
        - name: models
          persistentVolumeClaim: {claimName: triage-models}
        - name: code
          configMap: {name: triage-code}
        - name: dshm
          emptyDir: {medium: Memory, sizeLimit: 2Gi}
