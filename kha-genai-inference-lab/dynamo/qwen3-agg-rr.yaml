# M10-A: two aggregated vLLM workers (1 GPU each) behind the Dynamo frontend with default round-robin routing.
# --gpu-memory-utilization 0.40 deliberately limits KV cache (~100k tokens/worker) so cache locality matters:
# 48 policies x ~3k tokens do not fit in every worker, so round-robin keeps evicting shared prefixes.
apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: qwen3-agg-rr
  namespace: kha-dynamo
spec:
  components:
    - name: Frontend
      type: frontend
      replicas: 1
      podTemplate:
        spec:
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:${DYNAMO_VERSION}
    - name: VllmWorker
      type: worker
      replicas: 2
      sharedMemorySize: 8Gi
      podTemplate:
        spec:
          nodeSelector:
            kha.io/pool: dynamo
          tolerations:
            - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
            - {key: kubernetes.azure.com/scalesetpriority, operator: Equal, value: spot, effect: NoSchedule}
          volumes:
            - name: model-cache
              persistentVolumeClaim: {claimName: qwen3-model-cache}
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:${DYNAMO_VERSION}
              workingDir: /workspace/examples/backends/vllm
              command: ["python3", "-m", "dynamo.vllm"]
              args:
                - --model
                - ${DYNAMO_MODEL}
                - --max-model-len
                - "8192"
                - --gpu-memory-utilization
                - "0.40"
                - --enable-prefix-caching
              envFrom:
                - secretRef: {name: hf-token-secret}
              env:
                - {name: HF_HOME, value: /home/dynamo/.cache/huggingface}
              resources:
                limits: {nvidia.com/gpu: "1"}
              volumeMounts:
                - {name: model-cache, mountPath: /home/dynamo/.cache/huggingface}
