# Agent reasoning LLM on the 3g slice - Lab 02's priorauth-llm under a new name. Prefix caching matters even more for agent loops.
apiVersion: apps.nvidia.com/v1alpha1
kind: NIMService
metadata:
  name: triage-llm
  namespace: lfy-agent
spec:
  userID: 1000
  groupID: 0
  image:
    repository: ${NIM_LLM_IMAGE}
    tag: "${NIM_LLM_TAG}"
    pullPolicy: IfNotPresent
    pullSecrets:
      - ngc-secret
  authSecret: ngc-api-secret
  storage:
    nimCache:
      name: llama-3-1-8b
      profile: vllm-${LLM_PRECISION}-tp1-pp1
  env:
    - name: NIM_PASSTHROUGH_ARGS
      value: "--max-model-len ${AGENT_MAX_MODEL_LEN} ${AGENT_CACHE_FLAG} ${AGENT_EXTRA_ARGS}"
  replicas: 1
  resources:
    limits:
      ${MIG_LARGE}: 1
  nodeSelector:
    kha.io/pool: mig
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
    - key: kubernetes.azure.com/scalesetpriority
      operator: Equal
      value: spot
      effect: NoSchedule
  expose:
    service:
      type: ClusterIP
      port: 8000
  metrics:
    enabled: true
    serviceMonitor:
      interval: 15s
