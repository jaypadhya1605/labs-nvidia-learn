# Same tenancy pattern as Lab 02: namespace per tenant + ResourceQuota on MIG slices (chargeback + blast radius).
apiVersion: v1
kind: Namespace
metadata: {name: lfy-agent, labels: {lfy.io/tenant: soc-agent}}
---
apiVersion: v1
kind: Namespace
metadata: {name: lfy-safety, labels: {lfy.io/tenant: safety}}
---
apiVersion: v1
kind: Namespace
metadata: {name: lfy-data, labels: {lfy.io/tenant: data}}
---
apiVersion: v1
kind: Namespace
metadata: {name: lfy-bench, labels: {lfy.io/tenant: platform}}
---
apiVersion: v1
kind: ResourceQuota
metadata: {name: gpu-quota, namespace: lfy-agent}
spec:
  hard:
    requests.${MIG_LARGE}: "1"
    requests.${MIG_SMALL}: "1"
    requests.nvidia.com/gpu: "0"
---
apiVersion: v1
kind: ResourceQuota
metadata: {name: gpu-quota, namespace: lfy-safety}
spec:
  hard:
    requests.${MIG_MEDIUM}: "1"
    requests.${MIG_SMALL}: "1"
    requests.nvidia.com/gpu: "0"
