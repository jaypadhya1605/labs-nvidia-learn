# garak 0.17 target config: the SAME model behind the guarded gateway. Probes and target type come from the CLI (redteam/garak-job.yaml).
system:
  parallel_attempts: 8
  lite: true
run:
  generations: 1
  soft_probe_prompt_cap: 40
plugins:
  generators:
    openai:
      OpenAICompatible:
        uri: http://guarded-gateway.lfy-safety.svc:8080/v1/
        api_key: not-used
        model: meta/llama-3.1-8b-instruct
        max_tokens: 200
