# "fp8kv": FP8 KV cache - twice the cached tokens per GB, so more agent sessions fit before preemption.
# The documented, version-stable switch is KvCacheConfig.dtype ('auto' | 'fp8' | 'fp8_ds_mla' | 'nvfp4') in this options
# file, resolved when the LLM is built (TensorRT-LLM KvCacheConfig reference, 1.3.0rc27). Some trtllm-serve tags also
# take --kv_cache_dtype on the command line; the Helm chart and this launcher both use the YAML.
kv_cache_config:
  dtype: fp8
  enable_block_reuse: true
  free_gpu_memory_fraction: 0.85
enable_iter_perf_stats: true
