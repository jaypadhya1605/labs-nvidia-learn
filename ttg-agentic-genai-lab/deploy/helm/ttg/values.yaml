# Lab 05 chart: one chart for the laptop (kind + CPU mock engine) and GPU clusters (🔁 Lab 04 AKS/GKE).
# Cluster-specific choices live in deploy/values/<cluster>.yaml; defaults here are cloud-neutral.
cloud: generic                      # generic | kind | aks | gke   (labels + NOTES only)

# ONE image for the agent API, both MCP servers and the mock engine (deploy/Dockerfile).
image:
  repository: registry.gitlab.com/your-group/ttg-agentic-genai-lab/ttg-agent
  tag: "1.0.0"
  pullPolicy: IfNotPresent
imagePullSecrets: []                # e.g. [{name: gitlab-registry}] for a private GitLab Container Registry

secrets:
  mode: existing                    # none (mock) | existing (you create them) | external (External Secrets, 🔁 Lab 04)
  # existing/external both produce: hf-token-secret (HF_TOKEN), ngc-api-secret (NGC_API_KEY), ngc-secret (nvcr.io pulls)
  storeRef:
    kind: ClusterSecretStore
    name: plv-cloud-secrets         # 🔁 Lab 04's store (Azure Key Vault / Google Secret Manager)
  ngcKey: plv-ngc-api-key
  hfToken: plv-hf-token
  refreshInterval: 1h

engine:
  enabled: true                     # false = the agent calls agent.baseUrl (e.g. build.nvidia.com) instead
  kind: vllm                        # mock | vllm | sglang | trtllm | nim
  variant: base                     # same names as engines/launch.sh: base | nocache | fp8 | fp8kv | spec | eager | lora |
                                    #   tp2 | pp2 | dp2   (unsupported kind x variant pairs fail at render time)
  name: ttg-engine
  servedModelName: ttg-llm          # every engine serves the base model under this name (fair bake-off, one agent config)
  model: meta-llama/Llama-3.1-8B-Instruct        # gated: hf-token-secret must hold a token with the license accepted
  fp8Model: nvidia/Llama-3.1-8B-Instruct-FP8     # ModelOpt FP8 checkpoint served by variant fp8 (fp8Mode checkpoint)
  fp8Mode: checkpoint               # checkpoint = same FP8 weights on every engine (fair bake-off; Ada/Hopper/Blackwell)
                                    # online = vLLM / SGLang quantize the BF16 weights at load (--quantization fp8)
  maxModelLen: 16384
  gpuMemoryUtilization: 0.9         # vLLM --gpu-memory-utilization: share of TOTAL GPU memory
  sglang:
    memFractionStatic: 0.85         # SGLang --mem-fraction-static (= engines/launch.sh MEM_FRACTION)
  trtllm:
    kvCacheFreeFraction: 0.85       # kv_cache_config.free_gpu_memory_fraction: share of FREE memory after the weights
    maxBatchSize: 256
    maxNumTokens: 8192
  extraArgs: []                     # appended to the engine command line, e.g. ["--max-num-seqs", "128"]
  extraEnv: []                      # e.g. [{name: VLLM_LOGGING_LEVEL, value: DEBUG}] (no secrets here: schema blocks them)
  images:
    vllm: {repository: vllm/vllm-openai, tag: v0.31.0}
    sglang: {repository: lmsysorg/sglang, tag: v0.5.22}                   # -cu130 build for CUDA 13 drivers
    trtllm: {repository: nvcr.io/nvidia/tensorrt-llm/release, tag: 1.3.0rc29}
    nim: {repository: nvcr.io/nim/meta/llama-3.1-8b-instruct, tag: "2.0.13"}
  pullPolicy: IfNotPresent
  gpuResource: nvidia.com/gpu       # or a MIG resource such as nvidia.com/mig-3g.40gb (🔁 Lab 02)
  gpuCount: 1                       # tp2 / pp2 / dp2 variants request 2 automatically
  nim:
    profile: ""                     # NIM_MODEL_PROFILE; empty = NIM picks one for the GPU (list-model-profiles, 🔁 Lab 04)
    userID: 1000
    groupID: 0                      # 🔁 Lab 02: NIM needs group 0
  lora:
    name: ttg-short                 # M6 prompt-baked adapter; the agent switches to TTG_PROMPT_VARIANT=short
    path: /adapters/ttg-short
    maxRank: 16
    pvcName: ""                     # REQUIRED for variant=lora: PVC that holds the adapter directory
  cache:
    mode: pvc                       # pvc (survives restarts) | emptydir (download per pod; 🔁 Lab 04 GKE ADR-05)
    storageClass: ""                # "" = cluster default
    size: 100Gi
    accessMode: ReadWriteOnce
    emptyDirSizeLimit: 80Gi
  shmSize: 16Gi                     # /dev/shm for NCCL + PyTorch workers
  nodeSelector: {}
  tolerations: []
  resources: {}                     # extra cpu/memory; the GPU limit is always set from gpuResource x gpu count
  startupFailureThreshold: 180      # x 10 s = 30 minutes for the first model download
  autoscaling:
    enabled: false                  # scale engine replicas on queue depth (🔁 Lab 02 M9 / Lab 04 M7)
    mode: hpa                       # hpa (needs prometheus-adapter rules) | keda (needs KEDA)
    minReplicas: 1
    maxReplicas: 4
    queueDepthTarget: "4"           # waiting requests per pod
    metric: ""                      # "" = per kind: vllm_num_requests_waiting (vllm, nim) | sglang_num_queue_reqs (sglang)
    prometheusUrl: http://kps-prometheus.monitoring.svc:9090   # KEDA mode only (🔁 Lab 04 kube-prometheus-stack)
  mock:
    faults: ""                      # MOCK_FAULTS for the CPU mock, e.g. "invalid_json_once,slow"
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {cpu: "1", memory: 512Mi}

agent:
  enabled: true
  name: ttg-agent
  replicas: 2
  port: 8080
  baseUrl: ""                       # "" = the in-cluster engine; or e.g. https://integrate.api.nvidia.com/v1 (synthetic data!)
  model: ""                         # "" = automatic: engine.servedModelName, or the LoRA name (vLLM) / name:adapter (SGLang)
  apiKeySecret: {name: "", key: NVIDIA_API_KEY}   # only for a hosted baseUrl
  promptVariant: ""                 # "" = automatic: short with the lora variant, full otherwise
  thoughts: brief                   # brief | verbose (drill)
  structured: none                  # none | json_object | json_schema
  bustCache: false                  # true = drill: timestamp at the top of the system prompt
  maxSteps: 14
  maxTokens: 256
  temperature: "0"
  timeoutS: 60
  toolTimeoutS: 10
  healthPath: /healthz
  extraEnv: []
  resources:
    requests: {cpu: 250m, memory: 256Mi}
    limits: {cpu: "1", memory: 512Mi}
  autoscaling:
    enabled: true                   # CPU HPA (needs metrics-server; kind values turn it off)
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

mcp:
  enabled: true
  ops: {name: ttg-mcp-ops, port: 8101, replicas: 1}
  guest:
    name: ttg-mcp-guest
    port: 8102
    replicas: 1
    vlm:                            # M8: read_receipt via a VLM (sets TTG_VLM_*); also opens this server's egress
      baseUrl: ""                   # e.g. https://integrate.api.nvidia.com/v1 (synthetic receipts only) or http://ttg-vlm:8000/v1
      model: ""
      apiKeySecret: {name: "", key: NVIDIA_API_KEY}   # hosted VLM: Secret holding the key -> TTG_VLM_API_KEY
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 500m, memory: 256Mi}

helmTest:
  scenarioId: S0001                 # `helm test` posts this disruption through the agent and expects success

serviceMonitor:
  enabled: false                    # true on clusters with kube-prometheus-stack (🔁 Lab 04)
  interval: 15s

networkPolicy:
  enabled: true                     # agent egress = engine + MCP + DNS only (🔁 Lab 03: a fooled model cannot exfiltrate)
  allowNamespaces: []               # extra namespaces allowed to call the agent / engine (e.g. a load-test namespace)
  engineClients: []                 # extra pod `app` labels allowed to call the engine (M8 VLM release: [ttg-mcp-guest])
