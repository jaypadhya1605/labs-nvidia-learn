{{- if and .Values.agent.enabled .Values.agent.autoscaling.enabled }}
# Agent replicas on CPU: the agent waits on the engine most of the time, so CPU stays low until JSON parsing,
# MCP calls and scoring pile up at storm-day concurrency. The ENGINE is scaled on queue depth (below), never on CPU.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Values.agent.name }}
  labels: {{- include "ttg.labels" . | nindent 4 }}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: {{ .Values.agent.name }}}
  minReplicas: {{ .Values.agent.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.agent.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: {{ .Values.agent.autoscaling.targetCPUUtilizationPercentage }}}
---
{{- end }}
{{- $e := .Values.engine }}
{{- if and $e.enabled $e.autoscaling.enabled }}
{{- if eq $e.autoscaling.mode "keda" }}
# 🔁 Lab 02 M9 with KEDA instead of prometheus-adapter: scale on waiting requests straight from Prometheus.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ $e.name }}
  labels: {{- include "ttg.labels" . | nindent 4 }}
spec:
  scaleTargetRef: {name: {{ $e.name }}}
  minReplicaCount: {{ $e.autoscaling.minReplicas }}
  maxReplicaCount: {{ $e.autoscaling.maxReplicas }}
  cooldownPeriod: 600                  # a GPU replica takes minutes to start: do not flap
  triggers:
    - type: prometheus
      metadata:
        serverAddress: {{ $e.autoscaling.prometheusUrl }}
        query: {{ include "ttg.queuePromQL" . | quote }}
        threshold: {{ $e.autoscaling.queueDepthTarget | quote }}
{{- else }}
# 🔁 Lab 02 M9 / Lab 04 M7: scale the engine on queue depth (unmet demand), not GPU utilization (busy long before
# latency breaks). Needs a prometheus-adapter rule exposing {{ include "ttg.queueMetric" . }} (deploy/README.md).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $e.name }}
  labels: {{- include "ttg.labels" . | nindent 4 }}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: {{ $e.name }}}
  minReplicas: {{ $e.autoscaling.minReplicas }}
  maxReplicas: {{ $e.autoscaling.maxReplicas }}
  behavior:
    scaleDown: {stabilizationWindowSeconds: 600}
  metrics:
    - type: Pods
      pods:
        metric: {name: {{ include "ttg.queueMetric" . }}}
        target: {type: AverageValue, averageValue: {{ $e.autoscaling.queueDepthTarget | quote }}}
{{- end }}
{{- end }}
