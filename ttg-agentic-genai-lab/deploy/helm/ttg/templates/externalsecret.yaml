{{- if eq .Values.secrets.mode "external" }}
# 🔁 Lab 04: keys live in the cloud's secret manager; External Secrets materializes the three Kubernetes secrets:
#   hf-token-secret (HF_TOKEN, gated Llama download) · ngc-api-secret (NGC_API_KEY, NIM model download)
#   ngc-secret (docker config for nvcr.io pulls: NIM + TensorRT-LLM images)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hf-token-secret
  labels: {{- include "ttg.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.secrets.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.secrets.storeRef.kind }}
    name: {{ .Values.secrets.storeRef.name }}
  target:
    name: hf-token-secret
  data:
    - secretKey: HF_TOKEN
      remoteRef:
        key: {{ .Values.secrets.hfToken }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ngc-api-secret
  labels: {{- include "ttg.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.secrets.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.secrets.storeRef.kind }}
    name: {{ .Values.secrets.storeRef.name }}
  target:
    name: ngc-api-secret
  data:
    - secretKey: NGC_API_KEY
      remoteRef:
        key: {{ .Values.secrets.ngcKey }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ngc-secret
  labels: {{- include "ttg.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.secrets.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.secrets.storeRef.kind }}
    name: {{ .Values.secrets.storeRef.name }}
  target:
    name: ngc-secret
    template:
      type: kubernetes.io/dockerconfigjson
      engineVersion: v2
      data:
        .dockerconfigjson: {{ `'{"auths":{"nvcr.io":{"username":"$oauthtoken","password":"{{ .key }}","auth":"{{ printf "%s:%s" "$oauthtoken" .key | b64enc }}"}}}'` }}
  data:
    - secretKey: key
      remoteRef:
        key: {{ .Values.secrets.ngcKey }}
{{- end }}
