# M9: the "customer's internal registry" (Harbor/Artifactory in real life) - a distribution registry on the node,
# reachable as 127.0.0.1:5000 through hostNetwork. RKE2's registries.yaml mirrors nvcr.io, ghcr.io, docker.io,
# registry.k8s.io and quay.io to it, so manifests keep their ORIGINAL image names.
apiVersion: v1
kind: Namespace
metadata: {name: plv-registry}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: registry, namespace: plv-registry, labels: {app: registry}}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: registry}}
  template:
    metadata: {labels: {app: registry}}
    spec:
      hostNetwork: true
      containers:
        - name: registry
          image: ${PIN_REGISTRY_IMAGE}
          imagePullPolicy: IfNotPresent
          env:
            - {name: REGISTRY_HTTP_ADDR, value: "127.0.0.1:5000"}
            - {name: REGISTRY_STORAGE_DELETE_ENABLED, value: "true"}
          volumeMounts: [{name: data, mountPath: /var/lib/registry}]
          readinessProbe: {httpGet: {host: 127.0.0.1, path: /v2/, port: 5000}, periodSeconds: 5}
      volumes: [{name: data, hostPath: {path: /opt/registry, type: DirectoryOrCreate}}]
