# OKE workload identity (enhanced cluster) + IAM policy from Terraform scoped to this cluster's ESO service account.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: plv-cloud-secrets
spec:
  provider:
    oracle:
      vault: "${OCI_VAULT_OCID}"
      region: "${OCI_REGION}"
      principalType: Workload
      serviceAccountRef:
        name: external-secrets
        namespace: external-secrets
