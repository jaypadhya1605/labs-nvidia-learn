# GKE Workload Identity Federation: the ESO controller's KSA was granted secretAccessor directly (no keys, no GSA),
# so the provider needs no auth block - it uses the controller's Application Default Credentials.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: plv-cloud-secrets
spec:
  provider:
    gcpsm:
      projectID: "${GCP_PROJECT}"
