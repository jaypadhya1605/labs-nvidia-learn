# 🔁 Lab 02's GPU Operator values (only the sharing ConfigMap name changed): AKS pool gpu_driver = "None" -> operator-managed mode.
# NVIDIA GPU Operator on AKS, GPU-Operator-managed mode.
# The GPU pools are created with `--gpu-driver none`, so the operator must own BOTH the driver and the container
# toolkit (driver.enabled + toolkit.enabled + runtimeClass nvidia). Mixing modes leaves containerd without an
# `nvidia` runtime handler (FailedCreatePodSandBox).
driver:
  enabled: true
toolkit:
  enabled: true
  env:
    # Close the NVIDIA_VISIBLE_DEVICES env-var escape hatch for unprivileged pods (multi-tenant isolation)
    - name: ACCEPT_NVIDIA_VISIBLE_DEVICES_ENVVAR_WHEN_UNPRIVILEGED
      value: "false"
    - name: ACCEPT_NVIDIA_VISIBLE_DEVICES_AS_VOLUME_MOUNTS
      value: "true"
operator:
  runtimeClass: nvidia

# MIG: mixed strategy exposes each profile as its own resource (nvidia.com/mig-3g.40gb, ...).
mig:
  strategy: mixed
migManager:
  enabled: true
  env:
    # Cloud VMs may need a reboot to toggle MIG mode; let MIG Manager do it.
    - name: WITH_REBOOT
      value: "true"
  # No custom config: since v26.3 MIG Manager generates <node>-mig-config (incl. all-balanced) from the hardware.

# Sharing configs for the isolation experiment (M8). Select per node with label nvidia.com/device-plugin.config.
devicePlugin:
  config:
    create: true
    name: plv-gpu-sharing
    default: mig-mixed
    data:
      mig-mixed: |-
        version: v1
        flags:
          migStrategy: mixed
      ts-2: |-
        version: v1
        flags:
          migStrategy: none
        sharing:
          timeSlicing:
            renameByDefault: false
            failRequestsGreaterThanOne: true
            resources:
              - name: nvidia.com/gpu
                replicas: 2
      mps-2: |-
        version: v1
        flags:
          migStrategy: none
        sharing:
          mps:
            renameByDefault: false
            resources:
              - name: nvidia.com/gpu
                replicas: 2

# DCGM metrics for performance AND power-efficiency analysis.
dcgmExporter:
  config:
    name: plv-dcgm-metrics
    create: true
    data: |-
      # DCGM FIELD, Prometheus metric type, help message
      DCGM_FI_DEV_SM_CLOCK, gauge, SM clock frequency (in MHz).
      DCGM_FI_DEV_MEM_CLOCK, gauge, Memory clock frequency (in MHz).
      DCGM_FI_DEV_GPU_TEMP, gauge, GPU temperature (in C).
      DCGM_FI_DEV_POWER_USAGE, gauge, Power draw (in W).
      DCGM_FI_DEV_TOTAL_ENERGY_CONSUMPTION, counter, Total energy consumption since boot (in mJ).
      DCGM_FI_DEV_GPU_UTIL, gauge, GPU utilization (in %).
      DCGM_FI_DEV_MEM_COPY_UTIL, gauge, Memory utilization (in %).
      DCGM_FI_DEV_FB_FREE, gauge, Framebuffer memory free (in MiB).
      DCGM_FI_DEV_FB_USED, gauge, Framebuffer memory used (in MiB).
      DCGM_FI_DEV_XID_ERRORS, gauge, Value of the last XID error encountered.
      DCGM_FI_PROF_GR_ENGINE_ACTIVE, gauge, Ratio of time the graphics engine is active.
      DCGM_FI_PROF_SM_ACTIVE, gauge, Ratio of cycles an SM has at least 1 warp assigned.
      DCGM_FI_PROF_SM_OCCUPANCY, gauge, Ratio of warps resident on an SM.
      DCGM_FI_PROF_PIPE_TENSOR_ACTIVE, gauge, Ratio of cycles the tensor (HMMA) pipe is active.
      DCGM_FI_PROF_DRAM_ACTIVE, gauge, Ratio of cycles the device memory interface is active.
      DCGM_FI_PROF_PCIE_TX_BYTES, gauge, Rate of data transmitted over PCIe (bytes/s).
      DCGM_FI_PROF_PCIE_RX_BYTES, gauge, Rate of data received over PCIe (bytes/s).
  env:
    - name: DCGM_EXPORTER_COLLECTORS
      value: /etc/dcgm-exporter/dcgm-metrics.csv
  serviceMonitor:
    enabled: true
    interval: 15s
    # Keep the workload's namespace/pod labels (otherwise they become exported_namespace/exported_pod).
    honorLabels: true

# Operator daemonsets and NFD must tolerate our GPU taint AND the AKS Spot taint.
daemonsets:
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
    - key: kubernetes.azure.com/scalesetpriority
      operator: Equal
      value: spot
      effect: NoSchedule
node-feature-discovery:
  worker:
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Equal
        value: ""
        effect: NoSchedule
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      - key: kubernetes.azure.com/scalesetpriority
        operator: Equal
        value: spot
        effect: NoSchedule
