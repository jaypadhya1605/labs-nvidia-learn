# M6: the Lab 02 triage classifier on ANY cloud, built where it is served:
#   init 1 gen-data (CPU)  ->  init 2 train + ONNX export (PyTorch, GPU)  ->  init 3 TensorRT build (GPU)  ->  Triton
# One pod, an emptyDir work volume, no storage-class assumptions (works on AKS, GKE, EKS, OKE, RKE2).
# Needs a free GPU: run engines/bakeoff.sh <cluster> pause first (scales the NIM to 0 inside a GitOps pause).
#   kubectl -n plv-serving create configmap triage-code --from-file=engines/triton/
#   ENGINE_MODE=build scripts/render.sh engines/triton/triage.yaml | kubectl apply -f -
apiVersion: apps/v1
kind: Deployment
metadata:
  name: triage-triton
  namespace: plv-serving
  labels: {app: triage-triton}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: triage-triton}
  template:
    metadata:
      labels: {app: triage-triton}
    spec:
      nodeSelector: {plv.io/pool: gpu}
      tolerations:
        - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
        - {key: kubernetes.azure.com/scalesetpriority, operator: Equal, value: spot, effect: NoSchedule}
        - {key: cloud.google.com/gke-spot, operator: Equal, value: "true", effect: NoSchedule}
      initContainers:
        - name: gen-data
          image: python:3.12-slim
          command: ["python3", "/code/gen_data.py"]
          env: [{name: OUT_PATH, value: /work/triage/data/synthetic.jsonl}]
          volumeMounts: [{name: work, mountPath: /work}, {name: code, mountPath: /code}]
        - name: train-export
          image: nvcr.io/nvidia/pytorch:${PIN_NGC_RELEASE}-py3
          command: ["bash", "-c", "pip install -q 'transformers==${PIN_TRANSFORMERS}' onnx onnxscript && python /code/train_export.py"]
          env:
            - {name: WORK_DIR, value: /work/triage}
            - {name: HF_HOME, value: /work/hf-cache}
          resources:
            limits: {nvidia.com/gpu: 1}
          volumeMounts: [{name: work, mountPath: /work}, {name: code, mountPath: /code}, {name: dshm, mountPath: /dev/shm}]
        - name: build-engine
          image: nvcr.io/nvidia/tensorrt:${PIN_NGC_RELEASE}-py3
          command: ["bash", "/code/build_engine.sh"]
          env:
            - {name: WORK_DIR, value: /work/triage}
            - {name: ENGINE_MODE, value: "${ENGINE_MODE}"}
          resources:
            limits: {nvidia.com/gpu: 1}
          volumeMounts: [{name: work, mountPath: /work}, {name: code, mountPath: /code}]
      containers:
        - name: triton
          image: nvcr.io/nvidia/tritonserver:${PIN_NGC_RELEASE}-py3
          command: ["tritonserver"]
          args: ["--model-repository=/work/triage/model_repository", "--log-verbose=0", "--exit-on-error=false"]
          ports:
            - {name: http, containerPort: 8000}
            - {name: grpc, containerPort: 8001}
            - {name: metrics, containerPort: 8002}
          readinessProbe:
            httpGet: {path: /v2/models/triage_trt/ready, port: 8000}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            limits: {nvidia.com/gpu: 1}
          volumeMounts: [{name: work, mountPath: /work}]
      volumes:
        - {name: work, emptyDir: {sizeLimit: 20Gi}}
        - {name: code, configMap: {name: triage-code}}
        - {name: dshm, emptyDir: {medium: Memory, sizeLimit: 2Gi}}
---
apiVersion: v1
kind: Service
metadata:
  name: triage-triton
  namespace: plv-serving
  labels: {app: triage-triton}
spec:
  selector: {app: triage-triton}
  ports:
    - {name: http, port: 8000, targetPort: 8000}
    - {name: grpc, port: 8001, targetPort: 8001}
    - {name: metrics, port: 8002, targetPort: 8002}
