# Root "app of apps" for oke: Argo CD in this cluster pulls everything under gitops/clusters/oke.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: plv-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/YOUR_GITHUB_USER/plv-multicloud-nim-lab.git
    targetRevision: main
    path: gitops/clusters/oke
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
