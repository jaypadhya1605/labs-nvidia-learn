apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloud-secret-store
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  project: default
  source:
    repoURL: https://github.com/YOUR_GITHUB_USER/plv-multicloud-nim-lab.git
    targetRevision: main
    path: clusters/oke/generated
    directory:
      include: "clustersecretstore.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
