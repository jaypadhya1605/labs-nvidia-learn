apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gke-gpu-operator-quota
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-9"
spec:
  project: default
  source:
    repoURL: https://github.com/YOUR_GITHUB_USER/plv-multicloud-nim-lab.git
    targetRevision: main
    path: platform/gke
  destination:
    server: https://kubernetes.default.svc
    namespace: gpu-operator
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
