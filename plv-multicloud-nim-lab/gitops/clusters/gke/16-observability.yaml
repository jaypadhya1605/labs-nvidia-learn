apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: plv-observability
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  project: default
  source:
    repoURL: https://github.com/YOUR_GITHUB_USER/plv-multicloud-nim-lab.git
    targetRevision: main
    path: observability
    directory:
      include: "*.yaml"          # rules + dashboard ConfigMap only (dashboards/*.json and *.py are build inputs)
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
