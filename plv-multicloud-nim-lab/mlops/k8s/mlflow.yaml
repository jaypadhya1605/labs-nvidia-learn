# M8: MLflow tracking server (SQLite + artifacts on a PVC) in plv-mlops. Lab-sized; production = managed DB + object store.
apiVersion: v1
kind: Namespace
metadata:
  name: plv-mlops
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: mlflow-data, namespace: plv-mlops}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 20Gi}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: plv-mlops-data, namespace: plv-mlops}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 50Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: mlflow, namespace: plv-mlops, labels: {app: mlflow}}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: mlflow}}
  template:
    metadata: {labels: {app: mlflow}}
    spec:
      containers:
        - name: mlflow
          image: python:3.12-slim
          command: ["bash", "-c"]
          args:
            - pip install -q "mlflow==${PIN_MLFLOW}" &&
              mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:////mlflow/mlflow.db
              --artifacts-destination /mlflow/artifacts --serve-artifacts --allowed-hosts "*"
          ports: [{containerPort: 5000, name: http}]
          readinessProbe: {httpGet: {path: /health, port: 5000}, periodSeconds: 10, failureThreshold: 60}
          resources: {requests: {cpu: 250m, memory: 1Gi}, limits: {cpu: "1", memory: 2Gi}}
          volumeMounts: [{name: data, mountPath: /mlflow}]
      volumes: [{name: data, persistentVolumeClaim: {claimName: mlflow-data}}]
---
apiVersion: v1
kind: Service
metadata: {name: mlflow, namespace: plv-mlops}
spec:
  selector: {app: mlflow}
  ports: [{name: http, port: 5000, targetPort: 5000}]
