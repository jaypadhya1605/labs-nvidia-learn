# The HF token for training comes from the SAME cloud secret store as the serving namespace (no secret in Git).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: hf-token-secret, namespace: plv-mlops}
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: plv-cloud-secrets}
  target: {name: hf-token-secret}
  data:
    - secretKey: HF_TOKEN
      remoteRef: {key: plv-hf-token}
