# M8 step 2: LoRA training on a MIG 3g.40gb slice of the AKS A100 (the other slice keeps serving).
# Also the "aggressor" for bench/noisy_neighbor.sh. Render: ADAPTER_NAME=plover-style-v1 scripts/render.sh ...
apiVersion: batch/v1
kind: Job
metadata: {name: plover-train, namespace: plv-mlops}
spec:
  backoffLimit: 0
  template:
    metadata: {labels: {app: plover-train}}
    spec:
      restartPolicy: Never
      nodeSelector: {plv.io/pool: gpu}
      tolerations:
        - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
        - {key: kubernetes.azure.com/scalesetpriority, operator: Equal, value: spot, effect: NoSchedule}
      containers:
        - name: train
          image: nvcr.io/nvidia/pytorch:${PIN_NGC_RELEASE}-py3
          command: ["bash", "-c"]
          args:
            - pip install -q "peft==${PIN_PEFT}" "transformers==${PIN_TRANSFORMERS}" "mlflow==${PIN_MLFLOW}" &&
              python /code/train_lora.py
          env:
            - {name: ADAPTER_NAME, value: "${ADAPTER_NAME}"}
            - {name: DATA_DIR, value: /data/mlops}
            - {name: OUT_DIR, value: /data/adapters}
            - {name: HF_HOME, value: /data/hf-cache}
            - {name: MLFLOW_TRACKING_URI, value: "http://mlflow.plv-mlops.svc:5000"}
            - name: HF_TOKEN
              valueFrom: {secretKeyRef: {name: hf-token-secret, key: HF_TOKEN}}
          resources:
            limits: {nvidia.com/mig-3g.40gb: 1}
          volumeMounts: [{name: data, mountPath: /data}, {name: code, mountPath: /code}, {name: dshm, mountPath: /dev/shm}]
      volumes:
        - {name: data, persistentVolumeClaim: {claimName: plv-mlops-data}}
        - {name: code, configMap: {name: plover-mlops-code}}
        - {name: dshm, emptyDir: {medium: Memory, sizeLimit: 8Gi}}
