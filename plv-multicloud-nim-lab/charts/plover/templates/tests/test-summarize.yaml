{{- if .Values.api.enabled }}
# `helm test plover` - a release is not "done" until a real summarize call passes schema validation.
apiVersion: v1
kind: Pod
metadata:
  name: plover-test-summarize
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: test
      image: curlimages/curl:8.17.0
      command: ["sh", "-c"]
      args:
        - |
          set -e
          out=$(curl -sf -m 120 -X POST http://{{ include "plover.apiName" . }}:8080/v1/prior-auth/summarize \
            -H 'Content-Type: application/json' \
            -d '{"request_id":"helm-test","case_text":"Prior authorization request 00001 (standard). Member M12345678, 58-year-old. Requested service: lumbar spine MRI without contrast (CPT 72148). Diagnosis: lumbar radiculopathy (ICD-10 M54.16). History: six weeks of physical therapy without improvement. Exam/results: positive straight-leg raise on exam."}')
          echo "$out"
          echo "$out" | grep -q '"schema_valid":true'
{{- end }}
