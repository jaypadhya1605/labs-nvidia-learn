{{- if .Values.api.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "plover.apiName" . }}
  labels: {{- include "plover.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app: {{ include "plover.apiName" . }}
  template:
    metadata:
      labels:
        app: {{ include "plover.apiName" . }}
        app.kubernetes.io/part-of: plover
      annotations:
        # restart API pods when routing changes (canary weight lives in env)
        plv.io/routing: {{ toJson .Values.api.routing | sha256sum | trunc 16 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: api
          image: {{ printf "%s:%s" .Values.api.image.repository .Values.api.image.tag }}
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          env:
            - name: LLM_URL
              value: {{ printf "http://%s:8000" (include "plover.llmName" .) | quote }}
            - name: BASE_MODEL
              value: {{ include "plover.baseModel" . | quote }}
            - name: STABLE_MODEL
              value: {{ .Values.api.routing.stableModel | quote }}
            - name: CANARY_MODEL
              value: {{ .Values.api.routing.canaryModel | quote }}
            - name: CANARY_WEIGHT
              value: {{ .Values.api.routing.canaryWeight | quote }}
            - name: LLM_EXTRA_BODY
              value: {{ toJson (.Values.api.llmExtraBody | default dict) | quote }}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "plover.apiName" . }}
  labels:
    app: {{ include "plover.apiName" . }}
    {{- include "plover.labels" . | nindent 4 }}
spec:
  selector:
    app: {{ include "plover.apiName" . }}
  ports:
    - {name: http, port: 8080, targetPort: 8080}
{{- if .Values.serviceMonitor.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "plover.apiName" . }}
  labels: {{- include "plover.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app: {{ include "plover.apiName" . }}
  endpoints:
    - {port: http, path: /metrics, interval: 15s}
{{- end }}
{{- end }}
