{{- if .Values.bench.toolbox.enabled }}
# 🔁 Lab 02's AIPerf toolbox, now part of the chart so every cloud benchmarks from inside its own network.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bench-results
  labels: {{- include "plover.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 32Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bench-toolbox
  labels: {{- include "plover.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels:
      app: bench-toolbox
  template:
    metadata:
      labels:
        app: bench-toolbox
    spec:
      containers:
        - name: toolbox
          image: python:3.12-slim
          command: ["bash", "-c"]
          args:
            - |
              set -e
              apt-get update -qq && apt-get install -y -qq --no-install-recommends curl jq procps >/dev/null
              pip install --no-cache-dir -q "aiperf=={{ .Values.bench.toolbox.aiperfVersion }}" transformers pytest httpx openai
              mkdir -p /results && touch /tmp/ready && echo "toolbox ready"
              sleep infinity
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef: {name: hf-token-secret, key: HF_TOKEN, optional: true}
            - {name: HF_HOME, value: /results/.hf}
          readinessProbe:
            exec:
              command: ["test", "-f", "/tmp/ready"]
            periodSeconds: 10
            failureThreshold: 90
          resources:
            requests: {cpu: "1", memory: 2Gi}
            limits: {cpu: "4", memory: 8Gi}
          volumeMounts:
            - {name: results, mountPath: /results}
      volumes:
        - name: results
          persistentVolumeClaim:
            claimName: bench-results
{{- end }}
